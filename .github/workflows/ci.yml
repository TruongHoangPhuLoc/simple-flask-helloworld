# Trunk-based. PRs run everything; main additionally pushes the image.
# Kept deliberately small -- this is a hello-world, not a platform.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: simple-flask-helloworld
  # Names used by more than one step live here. Repeating a literal is how the
  # cluster ended up created as one name and loaded into under another.
  KIND_CLUSTER: simple-flask-helloworld
  K8S_NAMESPACE: hello

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: pytest -q

      # Dependency scan runs here, before the build -- there is no image yet
      # to scan at this point. The image scan is a separate step below.
      - run: pip install pip-audit && pip-audit -r requirements.txt

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Compute the tag once. It is used by build, scan, kind load, deploy and
      # the smoke assertion -- repeating the expression in each of them is how
      # the scan ended up looking for a full-length SHA that build never made.
      - name: Resolve image tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --build-arg GIT_SHA=${SHORT_SHA} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ${IMAGE_REF} .

      # Image scan. Base image CVEs are usually where they are, and those only
      # exist once the image is built.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Create kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}

      # No registry in the loop, so the image has to be loaded into the
      # cluster. Without this the pod sits in ErrImagePull.
      - name: Load image into kind
        run: kind load docker-image ${IMAGE_REF} --name ${KIND_CLUSTER}

      - name: Deploy
        run: |
          kubectl apply -f k8s/manifests.yaml
          kubectl -n ${K8S_NAMESPACE} set image deployment/hello hello=${IMAGE_REF}
          kubectl -n ${K8S_NAMESPACE} rollout status deployment/hello --timeout=120s

      # The interesting assertion: the running app must report the commit that
      # triggered this run. Proves the deployed container came from this
      # source, not a stale image that happened to be lying around.
      - name: Smoke test
        run: |
          kubectl -n ${K8S_NAMESPACE} port-forward svc/hello 8080:80 &
          sleep 5
          EXPECT_VERSION=${SHORT_SHA} ./scripts/smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n ${K8S_NAMESPACE} get pods -o wide
          kubectl -n ${K8S_NAMESPACE} describe deployment/hello
          kubectl -n ${K8S_NAMESPACE} logs -l app=hello --tail=100 || true
